repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: vectorcode
        name: vectorcode vectorise staged files
        entry: sh -c '[ -d .vectorcode ] && vectorcode vectorise "$@" || true' --
        language: system
        pass_filenames: true
        require_serial: true
