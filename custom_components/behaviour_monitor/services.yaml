enable_holiday_mode:
  name: Enable holiday mode
  description: Pause learning and welfare alerts while the occupant is away. Panic and device health still alert.

disable_holiday_mode:
  name: Disable holiday mode
  description: Resume learning and welfare alerts.

snooze:
  name: Snooze
  description: Suppress welfare and statistical delivery for a while. Panic and device health still alert.
  fields:
    duration:
      name: Duration
      required: true
      example: "2_hours"
      selector:
        select:
          options:
            - label: "1 Hour"
              value: "1_hour"
            - label: "2 Hours"
              value: "2_hours"
            - label: "4 Hours"
              value: "4_hours"
            - label: "1 Day"
              value: "1_day"

clear_snooze:
  name: Clear snooze
  description: Resume delivery immediately.

clear_alert:
  name: Clear alert
  description: Clear open panic alerts. Clears every open panic when no alert id is given.
  fields:
    alert_id:
      name: Alert ID
      required: false
      example: "welfare:house:panic@binary_sensor.panic"
      selector:
        text: {}

reset_learning:
  name: Reset learning
  description: Wipe learned patterns for one entity, or for the whole site when no entity is given, then relearn from the recorder.
  fields:
    entity_id:
      name: Entity
      required: false
      example: "binary_sensor.kitchen_motion"
      selector:
        entity: {}

test_panic:
  name: Test panic
  description: Open a test panic alert through the real event path without touching learned state.
